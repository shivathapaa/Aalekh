# Version catalog for the Aalekh demo consumer.
#
# Aalekh reads catalogs through Gradle's own VersionCatalogsExtension, so a plugin applied as
# `alias(libs.plugins.kotlinJvm)` is reported with both its alias and the id and version it resolves
# to - no TOML parsing involved.
[versions]
kotlin = "2.3.0"
okhttp = "4.12.0"

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
moshi = { module = "com.squareup.moshi:moshi", version = "1.15.1" }
gson = { module = "com.google.code.gson:gson", version = "2.11.0" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version = "5.11.3" }
