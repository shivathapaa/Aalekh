version: 2
updates:
  # Gradle dependencies declared in the version catalog and build scripts.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # JUnit 6 requires a Java 17 baseline; Aalekh targets JVM 11 bytecode
      # (-Xjdk-release=11). Stay on the JUnit 5.x line until that target changes.
      - dependency-name: "org.junit.jupiter:*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in the workflows under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
