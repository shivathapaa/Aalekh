name: Compatibility matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jdk-matrix:
    name: Build on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '11', '17', '21' ]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.jdk }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-jdk${{ matrix.jdk }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-jdk${{ matrix.jdk }}-

      - name: Compile + unit tests
        run: ./gradlew checkAll

      - name: Functional tests (Gradle TestKit)
        run: ./gradlew :aalekh-gradle:functionalTest

  cc-regression:
    name: Configuration cache reuse
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cc-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-cc-

      # The functional test "aalekhReport is configuration cache compatible on second run"
      # already exercises CC reuse against a fixture project; this job re-runs Aalekh's own
      # build twice and asserts the second invocation hits the configuration cache, catching
      # any new task that captures a non-serializable input.
      - name: First build (warms CC)
        run: ./gradlew check --configuration-cache

      - name: Second build must reuse CC
        run: |
          output=$(./gradlew check --configuration-cache 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "Configuration cache entry (reused|loaded)"; then
            echo "✓ CC entry reused"
          else
            echo "::error::Second build did not reuse the configuration cache entry"
            exit 1
          fi
