name: Compatibility matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  jdk-matrix:
    name: Build on JDK ${{ matrix.jdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [ '17', '21' ]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ matrix.jdk }}

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-jdk${{ matrix.jdk }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-jdk${{ matrix.jdk }}-

      - name: Compile + unit tests
        run: ./gradlew checkAll

      - name: Functional tests (Gradle TestKit)
        run: ./gradlew :aalekh-gradle:functionalTest

  bytecode-target:
    name: Library JARs ship as Java 11 bytecode
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - name: Build library JARs
        run: ./gradlew :aalekh-model:jar :aalekh-analysis:jar :aalekh-report:jar :aalekh-gradle:jar

      - name: Assert class-file major version is 55 (Java 11) for every module
        run: |
          set -euo pipefail
          mkdir -p /tmp/aalekh-bytecode-check
          fail=0
          for mod in aalekh-model aalekh-analysis aalekh-report aalekh-gradle; do
            jarfile=$(ls "$mod"/build/libs/"$mod"-*.jar | grep -v sources | grep -v javadoc | head -n1)
            entry=$(unzip -Z1 "$jarfile" | grep '\.class$' | grep -v 'module-info' | head -n1)
            if [ -z "$entry" ]; then
              echo "::error::No class entries found in $jarfile"
              fail=1
              continue
            fi
            unzip -o -p "$jarfile" "$entry" > /tmp/aalekh-bytecode-check/sample.class
            major=$(javap -v /tmp/aalekh-bytecode-check/sample.class | grep -m1 'major version:' | awk '{print $3}')
            if [ "$major" = "55" ]; then
              echo "✓ $mod -> $entry: major version 55 (Java 11)"
            else
              echo "::error::$mod -> $entry: major version $major (expected 55 for Java 11)"
              fail=1
            fi
          done
          exit $fail

  cc-regression:
    name: Configuration cache reuse
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cc-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-cc-

      # The functional test "aalekhReport is configuration cache compatible on second run"
      # already exercises CC reuse against a fixture project; this job re-runs Aalekh's own
      # build twice and asserts the second invocation hits the configuration cache, catching
      # any new task that captures a non-serializable input.
      - name: First build (warms CC)
        run: ./gradlew check --configuration-cache

      - name: Second build must reuse CC
        run: |
          output=$(./gradlew check --configuration-cache 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "Configuration cache entry (reused|loaded)"; then
            echo "✓ CC entry reused"
          else
            echo "::error::Second build did not reuse the configuration cache entry"
            exit 1
          fi
