name: Gradle wrapper validation

# Verifies gradle/wrapper/gradle-wrapper.jar matches a known-good published checksum,
# so a tampered wrapper jar cannot smuggle code into the build. Cheap supply-chain guard.
on:
  push:
    paths:
      - 'gradle/wrapper/**'
      - '.github/workflows/gradle-wrapper-validation.yml'
  pull_request:
    paths:
      - 'gradle/wrapper/**'
      - '.github/workflows/gradle-wrapper-validation.yml'

permissions:
  contents: read

jobs:
  validation:
    name: Validate wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
