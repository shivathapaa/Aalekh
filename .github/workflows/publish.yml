name: Publish

on:
  release:
    types: [ released, prereleased ]

jobs:
  test:
    name: Run all tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Run unit tests
        run: ./gradlew test

      - name: Run functional tests
        run: ./gradlew functionalTest

  publish-maven-central:
    name: Publish to Maven Central
    needs: test
    runs-on: ubuntu-latest
    # id-token + attestations let us record signed build provenance for the published jars (no new
    # secrets - GitHub's OIDC token is used). contents:read is the least privilege for checkout.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Publish to Maven Central
        run: >
          ./gradlew
          :aalekh-model:publishAndReleaseToMavenCentral
          :aalekh-analysis:publishAndReleaseToMavenCentral
          :aalekh-report:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Attest build provenance for the published jars
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            aalekh-model/build/libs/*.jar
            aalekh-analysis/build/libs/*.jar
            aalekh-report/build/libs/*.jar

  publish-plugin-portal:
    name: Publish to Gradle Plugin Portal
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew :aalekh-gradle:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Attest build provenance for the plugin jar
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            aalekh-gradle/build/libs/*.jar

  smoke-test:
    name: Smoke-test the published plugin
    needs: [ publish-plugin-portal ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Resolve version from release tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate a throwaway consumer project
        run: |
          mkdir -p smoke
          cat > smoke/settings.gradle.kts <<EOF
          plugins { id("io.github.shivathapaa.aalekh") version "${{ steps.version.outputs.version }}" }
          rootProject.name = "aalekh-smoke"
          EOF
          cat > smoke/build.gradle.kts <<EOF
          plugins { java }
          aalekh { openBrowserAfterReport.set(false) }
          EOF

      - name: Apply the freshly published plugin and run aalekhReport
        working-directory: smoke
        # The Plugin Portal can take a few minutes to index a new version, so retry before failing.
        run: |
          for attempt in 1 2 3 4 5; do
            if gradle aalekhReport --no-configuration-cache; then
              echo "Smoke test passed on attempt $attempt."
              exit 0
            fi
            echo "Attempt $attempt failed (plugin may not be indexed yet); waiting 60s..."
            sleep 60
          done
          echo "::error::Published plugin ${{ steps.version.outputs.version }} could not be applied after 5 attempts."
          exit 1
